name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Builds the shippable per-arch binaries and uploads them as artifacts. The
# installer-assembly job (cargo xtask dist -> makensis) is added once the NSIS
# script and Linux install assets land in the installer/WSL phases.

jobs:
  windows-dll:
    name: dll (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build release DLL
        run: cargo build --release --target ${{ matrix.target }} -p accesskit_remote_dvc_plugin
      - uses: actions/upload-artifact@v4
        with:
          name: dll-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/accesskit_remote_dvc_plugin.dll
          if-no-files-found: error

  linux-daemon:
    name: daemon (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Old glibc baseline so the daemon runs on stable distros.
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build release daemon
        run: cargo build --release --target ${{ matrix.target }} -p accesskit_remoted
      - uses: actions/upload-artifact@v4
        with:
          name: daemon-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/accesskit_remoted
          if-no-files-found: error

  installer:
    name: installer
    needs: [windows-dll, linux-daemon]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # xtask dist reads the binaries from target/<triple>/release/.
      - name: Stage binaries into the target layout
        shell: bash
        run: |
          for t in x86_64-pc-windows-msvc aarch64-pc-windows-msvc; do
            mkdir -p "target/$t/release"
            cp "artifacts/dll-$t/accesskit_remote_dvc_plugin.dll" "target/$t/release/"
          done
          for t in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            mkdir -p "target/$t/release"
            cp "artifacts/daemon-$t/accesskit_remoted" "target/$t/release/"
          done
      - name: Install NSIS
        run: choco install nsis -y --no-progress
      - name: Build installer
        run: cargo xtask dist
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: target/AccessKitRemote-Setup-*.exe
          if-no-files-found: error
