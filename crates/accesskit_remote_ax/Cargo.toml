[package]
name = "accesskit_remote_ax"
description = "macOS Accessibility (AXUIElement) tree source: mirrors AX trees into AccessKit trees"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
accesskit.workspace = true
accesskit_remote.workspace = true
accesskit_remote_server.workspace = true
tracing-subscriber.workspace = true
accesskit_remote_source.workspace = true
serde_json.workspace = true
tracing.workspace = true
objc2 = "0.6"
libc = "0.2"
objc2-application-services = "0.3"
objc2-core-foundation = "0.3"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-core-graphics = "0.3"

[target.'cfg(target_os = "macos")'.dev-dependencies]
# The real consumer, used to check what a screen reader would actually get out
# of the trees this crate builds. Every silent text defect so far — missing
# `text_direction`, runs drawn on top of each other — was invisible from the
# provider side and would have been caught here.
accesskit_consumer = "0.38"
serde_json.workspace = true
accesskit_remote_server.workspace = true
tracing-subscriber.workspace = true
