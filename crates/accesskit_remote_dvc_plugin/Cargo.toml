[package]
name = "accesskit_remote_dvc_plugin"
description = "RDP dynamic virtual channel plugin exposing remote AccessKit trees to UI Automation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
accesskit_remote_client.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
accesskit.workspace = true
accesskit_remote.workspace = true
accesskit_remote_transport.workspace = true
accesskit_remote_windows.workspace = true
uuid.workspace = true
windows-core.workspace = true
windows-registry.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "windows")'.dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_System_RemoteDesktop",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(target_os = "windows")'.dev-dependencies]
windows-core.workspace = true
parking_lot = "0.12"
libloading = "0.9"
serial_test = "3"

[target.'cfg(target_os = "windows")'.dev-dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_System_RemoteDesktop",
    "Win32_System_Com_StructuredStorage",
]
