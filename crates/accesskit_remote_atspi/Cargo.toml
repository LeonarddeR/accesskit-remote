[package]
name = "accesskit_remote_atspi"
description = "AT-SPI tree source: mirrors AT-SPI accessibility trees into AccessKit trees"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
accesskit.workspace = true
accesskit_remote.workspace = true
accesskit_remote_server.workspace = true
atspi.workspace = true
tokio = { workspace = true, features = ["time"] }
tokio-stream = "0.1"
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
accesskit_consumer = "0.38"
